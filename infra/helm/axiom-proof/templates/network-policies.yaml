apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-default-deny
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # Default-deny all ingress; only allow specific paths.
  # Default-deny all egress; only allow specific destinations.
---
# Allow DNS egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-allow-dns
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow ingress from ingress-nginx to web and marketing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-allow-ingress
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: axiom-proof
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
---
# Allow service-to-service on the data plane
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "axiom-proof.fullname" . }}-allow-internal
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: axiom-proof
  policyTypes:
    - Ingress
    - Egress
  # Both halves are required. A NetworkPolicy decision needs the sender's
  # egress AND the receiver's ingress to permit the flow, and this policy
  # carried only the egress half — so under the default-deny above, bff:4000,
  # agent-runtime:8000 and model-gateway:8001 admitted nothing. Only port 3000
  # from ingress-nginx was ever allowed in, which is the public edge, not the
  # data plane. No ports are listed here deliberately: the service ports differ
  # per component and restating them would drift from services.yaml.
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: axiom-proof
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: axiom-proof
    # Allow HTTPS egress to Supabase, AWS APIs, Temporal Cloud
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # direct Postgres if used
