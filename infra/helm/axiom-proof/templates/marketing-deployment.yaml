{{/*
The marketing Service and the Ingress rule for axiomproof.ai have both been in
this chart since 0.1.0 with nothing behind them: there was no marketing
Deployment, so the public site answered 503 on any Helm-deployed cluster. The
Service selector below is what the existing Service already looks for.

Environment mirrors the marketing service in docker-compose.staging.yml and
.preprod.yml, minus AXIOM_E2E_BYPASS_AUTH — that switch was removed from the
application in W0.0 and must never reach a deployed surface.
*/}}
{{- if .Values.marketing.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axiom-proof.fullname" . }}-marketing
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
    app.kubernetes.io/component: marketing
spec:
  replicas: {{ .Values.marketing.replicaCount }}
  selector:
    matchLabels:
      {{- include "axiom-proof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: marketing
  template:
    metadata:
      labels:
        {{- include "axiom-proof.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: marketing
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: marketing
          image: "{{ .Values.image.registry }}/axiom-marketing:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: ENVIRONMENT
              value: production
            - name: NEXT_PUBLIC_MARKETING_URL
              value: {{ .Values.marketing.env.NEXT_PUBLIC_MARKETING_URL | quote }}
            - name: NEXT_PUBLIC_APP_URL
              value: {{ .Values.marketing.env.NEXT_PUBLIC_APP_URL | quote }}
            - name: NEXT_PUBLIC_BFF_URL
              value: {{ .Values.marketing.env.NEXT_PUBLIC_BFF_URL | quote }}
            - name: BFF_PUBLIC_URL
              value: {{ .Values.marketing.env.BFF_PUBLIC_URL | quote }}
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-supabase
                  key: url
            - name: SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-supabase
                  key: anon-key
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-supabase
                  key: service-key
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.marketing.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      automountServiceAccountToken: false
{{- end }}
