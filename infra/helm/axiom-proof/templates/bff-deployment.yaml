apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axiom-proof.fullname" . }}-bff
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
    app.kubernetes.io/component: bff
spec:
  {{- if not .Values.bff.autoscaling.enabled }}
  replicas: {{ .Values.bff.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "axiom-proof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bff
  template:
    metadata:
      labels:
        {{- include "axiom-proof.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: bff
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      serviceAccountName: {{ include "axiom-proof.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: bff
          image: "{{ .Values.image.registry }}/axiom-bff:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "4000"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-supabase
                  key: url
            - name: SUPABASE_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-supabase
                  key: service-key
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion }}
            - name: MODEL_GATEWAY_URL
              value: {{ .Values.config.modelGatewayUrl }}
            - name: AGENT_RUNTIME_URL
              value: {{ .Values.config.agentRuntimeUrl }}
            - name: AGENT_RUNTIME_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-internal
                  key: agent-runtime-token
            - name: MODEL_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-internal
                  key: model-gateway-key
            - name: APPROVAL_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-internal
                  key: approval-key
            - name: AXIOM_MFA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-internal
                  key: mfa-encryption-key
            # The retiring half of the ring, present only while a rotation is
            # in flight. `optional` is what keeps the ordinary case working:
            # with no `mfa-encryption-keys-previous` key in the Secret the
            # variable is simply unset, which is how the BFF's key ring reads
            # "no retiring keys". Without it every pod would refuse to start
            # until someone added a key they do not have.
            - name: AXIOM_MFA_ENCRYPTION_KEYS_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-internal
                  key: mfa-encryption-keys-previous
                  optional: true
            - name: AXIOM_ASSESSMENT_DISPATCH_RETENTION_DAYS
              value: {{ .Values.config.assessmentDispatchRetentionDays | quote }}
            - name: AXIOM_MFA_SESSION_TTL_HOURS
              value: {{ .Values.config.mfaSessionTtlHours | default 12 | quote }}
            # 0 disables address-scoped MFA budgets. Set it to the number of
            # proxies in front of the BFF; see packages/config.
            - name: AXIOM_TRUSTED_PROXY_HOPS
              value: {{ .Values.config.trustedProxyHops | default 0 | quote }}
            - name: AXIOM_REPORT_EMAIL_MODE
              value: {{ .Values.bff.reportEmailMode | default "disabled" | quote }}
            - name: AXIOM_CONTACT_EMAIL_MODE
              value: {{ .Values.bff.contactEmailMode | default "disabled" | quote }}
            - name: CONTACT_RECIPIENT_EMAIL
              value: {{ .Values.bff.contactRecipientEmail | default "" | quote }}
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bff.reportEmailSecretName | default "axiom-report-email" | quote }}
                  key: resend-api-key
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      automountServiceAccountToken: false
