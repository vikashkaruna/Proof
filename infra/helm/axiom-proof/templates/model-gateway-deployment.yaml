apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axiom-proof.fullname" . }}-model-gateway
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
    app.kubernetes.io/component: model-gateway
spec:
  {{- if not .Values.modelGateway.autoscaling.enabled }}
  replicas: {{ .Values.modelGateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "axiom-proof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: model-gateway
  template:
    metadata:
      labels:
        {{- include "axiom-proof.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: model-gateway
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      serviceAccountName: {{ include "axiom-proof.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: model-gateway
          image: "{{ .Values.image.registry }}/axiom-model-gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: ENVIRONMENT
              value: production
            - name: PII_REDACTION_ENABLED
              value: {{ .Values.modelGateway.env.piiRedactionEnabled | quote }}
            - name: SELF_HOSTED_BASE_URL
              value: {{ .Values.modelGateway.env.selfHostedBaseUrl | quote }}
            - name: SELF_HOSTED_MODEL
              value: {{ .Values.modelGateway.env.selfHostedModel | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion }}
            - name: MODEL_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "axiom-proof.fullname" . }}-internal
                  key: model-gateway-key
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.modelGateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
