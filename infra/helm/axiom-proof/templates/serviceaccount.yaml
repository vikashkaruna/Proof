{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "axiom-proof.serviceAccountName" . }}
  labels:
    {{- include "axiom-proof.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # Must stay inside metadata: emitted after a top-level key it produces a
  # mapping under a scalar, which parses only while annotations are empty.
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
