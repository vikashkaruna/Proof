# ==============================================================================
# Axiom Proof — Staging Docker Compose Overlay
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.staging.yml --env-file infra/docker/environments/.env.staging up -d
#
# Supports pulling from Docker Hub or using locally built tagged images:
#   ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}axiom-<service>:${IMAGE_TAG:-staging}
# ==============================================================================
name: axiom-proof-staging

services:
  model-gateway:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}axiom-model-gateway:${IMAGE_TAG:-staging}
    ports:
      - '0.0.0.0:${MODEL_GATEWAY_PORT:-8001}:8001'
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - PII_REDACTION_ENABLED=${PII_REDACTION_ENABLED:-true}
      - MODEL_GATEWAY_API_KEY=${MODEL_GATEWAY_API_KEY:?Set a minted MODEL_GATEWAY_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REDIS_URL=${UPSTASH_REDIS_URL:-${REDIS_URL:-}}

  agent-runtime:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}axiom-agent-runtime:${IMAGE_TAG:-staging}
    ports:
      - '0.0.0.0:${AGENT_RUNTIME_PORT:-8000}:8000'
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - MODEL_GATEWAY_URL=${MODEL_GATEWAY_URL:-http://model-gateway:8001}
      - MODEL_GATEWAY_API_KEY=${MODEL_GATEWAY_API_KEY:?Set a minted MODEL_GATEWAY_API_KEY}
      - INTERNAL_TOKEN=${AGENT_RUNTIME_INTERNAL_TOKEN:?Set a minted AGENT_RUNTIME_INTERNAL_TOKEN}
      - AGENT_RUNTIME_INTERNAL_TOKEN=${AGENT_RUNTIME_INTERNAL_TOKEN:?Set a minted AGENT_RUNTIME_INTERNAL_TOKEN}
      - APPROVAL_SIGNING_KEY=${APPROVAL_SIGNING_KEY:?Set a minted APPROVAL_SIGNING_KEY}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:55321}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - REDIS_URL=${UPSTASH_REDIS_URL:-${REDIS_URL:-}}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-axiom-proof}
      - TEMPORAL_TLS=${TEMPORAL_TLS:-false}
      - AXIOM_REGION=${AXIOM_REGION:-${AWS_REGION:-ap-south-1}}
      - AXIOM_EVIDENCE_BUCKET=${AXIOM_EVIDENCE_BUCKET:-${AWS_S3_EVIDENCE_BUCKET:-axiom-proof-evidence-staging}}
      - AXIOM_STORAGE_ENDPOINT=${AXIOM_STORAGE_ENDPOINT:-${AWS_S3_ENDPOINT:-}}
      - AXIOM_STORAGE_ACCESS_KEY_ID=${AXIOM_STORAGE_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-test}}
      - AXIOM_STORAGE_SECRET_ACCESS_KEY=${AXIOM_STORAGE_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-test}}
      - S3_EVIDENCE_BUCKET=${AXIOM_EVIDENCE_BUCKET:-${AWS_S3_EVIDENCE_BUCKET:-axiom-proof-evidence-staging}}
      - S3_ENDPOINT=${AXIOM_STORAGE_ENDPOINT:-${AWS_S3_ENDPOINT:-}}
      - AWS_ACCESS_KEY_ID=${AXIOM_STORAGE_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-test}}
      - AWS_SECRET_ACCESS_KEY=${AXIOM_STORAGE_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-test}}

  bff:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}axiom-bff:${IMAGE_TAG:-staging}
    ports:
      - '0.0.0.0:${BFF_PORT:-4000}:4000'
    environment:
      - NODE_ENV=staging
      - AXIOM_ASSESSMENT_DISPATCH_RETENTION_DAYS=${AXIOM_ASSESSMENT_DISPATCH_RETENTION_DAYS:-90}
      - ENVIRONMENT=staging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AXIOM_REGION=${AXIOM_REGION:-${AWS_REGION:-ap-south-1}}
      - AWS_REGION=${AXIOM_REGION:-${AWS_REGION:-ap-south-1}}
      - AGENT_RUNTIME_URL=${AGENT_RUNTIME_URL:-http://agent-runtime:8000}
      - AGENT_RUNTIME_INTERNAL_TOKEN=${AGENT_RUNTIME_INTERNAL_TOKEN:?Set a minted AGENT_RUNTIME_INTERNAL_TOKEN}
      - MODEL_GATEWAY_URL=${MODEL_GATEWAY_URL:-http://model-gateway:8001}
      - MODEL_GATEWAY_API_KEY=${MODEL_GATEWAY_API_KEY:?Set a minted MODEL_GATEWAY_API_KEY}
      - APPROVAL_SIGNING_KEY=${APPROVAL_SIGNING_KEY:?Set a minted APPROVAL_SIGNING_KEY}
      - AXIOM_MFA_ENCRYPTION_KEY=${AXIOM_MFA_ENCRYPTION_KEY:?Set the distinct persistent MFA encryption key}
      - AXIOM_MFA_ENCRYPTION_KEYS_PREVIOUS=${AXIOM_MFA_ENCRYPTION_KEYS_PREVIOUS:-}
      - AXIOM_MFA_SESSION_TTL_HOURS=${AXIOM_MFA_SESSION_TTL_HOURS:-12}
      - AXIOM_TRUSTED_PROXY_HOPS=${AXIOM_TRUSTED_PROXY_HOPS:-0}
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-axiom-proof}
      - TEMPORAL_TLS=${TEMPORAL_TLS:-false}
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL:-}
      - REDIS_URL=${UPSTASH_REDIS_URL:-${REDIS_URL:-}}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:55321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - AXIOM_EVIDENCE_BUCKET=${AXIOM_EVIDENCE_BUCKET:-${AWS_S3_EVIDENCE_BUCKET:-axiom-proof-evidence-staging}}
      - AXIOM_STORAGE_ENDPOINT=${AXIOM_STORAGE_ENDPOINT:-${AWS_S3_ENDPOINT:-}}
      - AXIOM_STORAGE_ACCESS_KEY_ID=${AXIOM_STORAGE_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-test}}
      - AXIOM_STORAGE_SECRET_ACCESS_KEY=${AXIOM_STORAGE_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-test}}
      - AWS_S3_EVIDENCE_BUCKET=${AXIOM_EVIDENCE_BUCKET:-${AWS_S3_EVIDENCE_BUCKET:-axiom-proof-evidence-staging}}
      - AWS_S3_ENDPOINT=${AXIOM_STORAGE_ENDPOINT:-${AWS_S3_ENDPOINT:-}}
      - AWS_ACCESS_KEY_ID=${AXIOM_STORAGE_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-test}}
      - AWS_SECRET_ACCESS_KEY=${AXIOM_STORAGE_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-test}}
      - BFF_CORS_ORIGINS=${BFF_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - AXIOM_REPORT_EMAIL_MODE=${AXIOM_REPORT_EMAIL_MODE:-disabled}
      - FEATURE_DRY_RUN_ENGINE=${FEATURE_DRY_RUN_ENGINE:-true}
      - FEATURE_EXECUTION_ENGINE=${FEATURE_EXECUTION_ENGINE:-true}
      - FEATURE_LIVE_CONNECTORS=${FEATURE_LIVE_CONNECTORS:-true}
      - FEATURE_KILL_SWITCH=${FEATURE_KILL_SWITCH:-true}
      - PII_REDACTION_ENABLED=${PII_REDACTION_ENABLED:-true}

  temporal-worker:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}axiom-temporal-worker:${IMAGE_TAG:-staging}
    environment:
      - TEMPORAL_ADDRESS=${TEMPORAL_ADDRESS:-temporal:7233}
      - TEMPORAL_NAMESPACE=${TEMPORAL_NAMESPACE:-axiom-proof}
      - TEMPORAL_TLS=${TEMPORAL_TLS:-false}
      - AGENT_RUNTIME_URL=${AGENT_RUNTIME_URL:-http://agent-runtime:8000}
      - AGENT_RUNTIME_INTERNAL_TOKEN=${AGENT_RUNTIME_INTERNAL_TOKEN:?Set a minted AGENT_RUNTIME_INTERNAL_TOKEN}

  temporal-ui:
    ports:
      - '0.0.0.0:${TEMPORAL_UI_PORT:-8233}:8080'
    environment:
      - TEMPORAL_CORS_ORIGINS=${BFF_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}

  web:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}axiom-web:${IMAGE_TAG:-staging}
    ports:
      - '0.0.0.0:${WEB_PORT:-3001}:3001'
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=staging
      - NEXT_PUBLIC_BFF_URL=${NEXT_PUBLIC_BFF_URL:-http://${HOST_IP:-localhost}:4000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://${HOST_IP:-localhost}:3001}
      - BFF_PUBLIC_URL=${BFF_URL:-http://bff:4000}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:55321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:55321}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - AXIOM_E2E_BYPASS_AUTH=${AXIOM_E2E_BYPASS_AUTH:-false}

  marketing:
    image: ${DOCKER_REGISTRY:-}${DOCKER_REGISTRY:+/}axiom-marketing:${IMAGE_TAG:-staging}
    ports:
      - '0.0.0.0:${MARKETING_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=staging
      - NEXT_PUBLIC_BFF_URL=${NEXT_PUBLIC_BFF_URL:-http://${HOST_IP:-localhost}:4000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://${HOST_IP:-localhost}:3001}
      - NEXT_PUBLIC_MARKETING_URL=${NEXT_PUBLIC_MARKETING_URL:-http://${HOST_IP:-localhost}:3000}
      - BFF_PUBLIC_URL=${BFF_URL:-http://bff:4000}
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:55321}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:55321}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-Axiom Proof <onboarding@resend.dev>}
      - CONTACT_RECIPIENT_EMAIL=${CONTACT_RECIPIENT_EMAIL:-hello@axiomminds.ai}
      - CONTACT_FALLBACK_RECIPIENT_EMAIL=${CONTACT_FALLBACK_RECIPIENT_EMAIL:-hello@axiomminds.ai}
      - AXIOM_E2E_BYPASS_AUTH=${AXIOM_E2E_BYPASS_AUTH:-false}
