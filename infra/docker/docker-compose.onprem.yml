# Standalone sovereign topology; bootstrap-onprem.sh controls the startup order.
name: axiom-proof-onprem

x-common: &common
  ENVIRONMENT: onprem
  AXIOM_REGION: ap-south-1
  SUPABASE_URL: http://supabase-gateway:80
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?mint keys}
  SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?mint keys}
  SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set DB password}@supabase-db:5432/axiom_onprem
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: axiom-proof
  TEMPORAL_TLS: 'false'
  REDIS_URL: redis://redis:6379
  AXIOM_EVIDENCE_BUCKET: ${AXIOM_EVIDENCE_BUCKET:?set bucket}
  AXIOM_STORAGE_ENDPOINT: http://minio:9000
  AXIOM_STORAGE_ACCESS_KEY_ID: ${AXIOM_STORAGE_ACCESS_KEY_ID:?set storage user}
  AXIOM_STORAGE_SECRET_ACCESS_KEY: ${AXIOM_STORAGE_SECRET_ACCESS_KEY:?set storage secret}

services:
  supabase-db:
    image: ${AXIOM_POSTGRES_IMAGE:?supply approved PostgreSQL digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set DB password}
    volumes: [supabase-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      retries: 20
    networks: [sovereign]
  supabase-auth:
    image: ${AXIOM_AUTH_IMAGE:?supply approved GoTrue digest}
    restart: unless-stopped
    depends_on:
      supabase-db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set DB password}@supabase-db:5432/axiom_onprem?sslmode=disable&search_path=auth
      API_EXTERNAL_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set Auth origin}
      GOTRUE_SITE_URL: ${NEXT_PUBLIC_APP_URL:?set web origin}
      GOTRUE_URI_ALLOW_LIST: ${NEXT_PUBLIC_APP_URL:?set web origin}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?mint keys}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_DISABLE_SIGNUP: 'true'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9999/health']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [sovereign]
  supabase-rest:
    image: ${AXIOM_POSTGREST_IMAGE:?supply approved PostgREST digest}
    restart: unless-stopped
    depends_on:
      supabase-db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgresql://authenticator:${POSTGREST_DB_PASSWORD:?set REST login password}@supabase-db:5432/axiom_onprem
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:?mint keys}
    networks: [sovereign]
  supabase-gateway:
    image: ${AXIOM_INGRESS_IMAGE:?supply approved ingress digest}
    restart: unless-stopped
    ports: ['${AXIOM_BIND_ADDRESS:?set intranet bind}:${SUPABASE_API_PORT:-55321}:80']
    volumes: ['./onprem-supabase-gateway.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [supabase-auth, supabase-rest]
    networks: [sovereign]
  temporal-db:
    image: ${AXIOM_TEMPORAL_POSTGRES_IMAGE:?supply approved Temporal PostgreSQL digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set Temporal DB password}
      POSTGRES_DB: temporal
    volumes: [temporal-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d temporal']
      interval: 5s
      retries: 20
    networks: [sovereign]
  temporal:
    image: ${AXIOM_TEMPORAL_IMAGE:?supply approved Temporal digest}
    restart: unless-stopped
    depends_on:
      temporal-db: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: '5432'
      POSTGRES_SEEDS: temporal-db
      POSTGRES_PORT: '5432'
      POSTGRES_VISIBILITY_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set Temporal DB password}
      POSTGRES_DB: temporal
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      ENABLE_ES: 'false'
      DEFAULT_NAMESPACE: axiom-proof
      DEFAULT_NAMESPACE_RETENTION: 24h
    networks: [sovereign]
  redis:
    image: ${AXIOM_REDIS_IMAGE:?supply approved Redis digest}
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis-data:/data]
    networks: [sovereign]
  minio:
    image: ${AXIOM_WORM_SERVER_IMAGE:?supply approved WORM server digest}
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${AXIOM_STORAGE_ACCESS_KEY_ID:?set storage user}
      MINIO_ROOT_PASSWORD: ${AXIOM_STORAGE_SECRET_ACCESS_KEY:?set storage secret}
      MINIO_REGION_NAME: ap-south-1
    volumes: [minio-data:/data]
    networks: [sovereign]
  minio-init:
    image: ${AXIOM_WORM_CLIENT_IMAGE:?supply approved WORM client digest}
    depends_on:
      minio: {condition: service_started}
    entrypoint: ['/bin/sh', '-ec']
    command: |
      attempt=0
      until mc alias set local http://minio:9000 "$${AXIOM_STORAGE_ACCESS_KEY_ID}" "$${AXIOM_STORAGE_SECRET_ACCESS_KEY}" && mc ready local; do
        attempt=$$((attempt + 1))
        [ "$$attempt" -lt 30 ] || exit 1
        sleep 2
      done
      if ! mc stat "local/$${AXIOM_EVIDENCE_BUCKET}" >/dev/null 2>&1; then mc mb --with-lock "local/$${AXIOM_EVIDENCE_BUCKET}"; fi
      mc retention set --default COMPLIANCE 7y "local/$${AXIOM_EVIDENCE_BUCKET}"
      retention="$$(mc retention info --default "local/$${AXIOM_EVIDENCE_BUCKET}")"
      printf '%s\n' "$${retention}" | grep -qi COMPLIANCE
      printf '%s\n' "$${retention}" | grep -Eq '(^|[^0-9])7(y| year)|2555d'
    environment:
      AXIOM_STORAGE_ACCESS_KEY_ID: ${AXIOM_STORAGE_ACCESS_KEY_ID:?set storage user}
      AXIOM_STORAGE_SECRET_ACCESS_KEY: ${AXIOM_STORAGE_SECRET_ACCESS_KEY:?set storage secret}
      AXIOM_EVIDENCE_BUCKET: ${AXIOM_EVIDENCE_BUCKET:?set bucket}
    networks: [sovereign]
  model-gateway:
    image: ${AXIOM_MODEL_GATEWAY_IMAGE:?supply approved model gateway digest}
    restart: unless-stopped
    environment:
      ENVIRONMENT: onprem
      AXIOM_OFFLINE_LICENSE: ${AXIOM_OFFLINE_LICENSE:?set signed license}
      API_KEY: ${MODEL_GATEWAY_API_KEY:?set gateway key}
      SELF_HOSTED_MODEL: ${SELF_HOSTED_MODEL:-Qwen/Qwen2.5-32B-Instruct-AWQ}
      SELF_HOSTED_BASE_URL: ${SELF_HOSTED_BASE_URL:-}
      PII_REDACTION_ENABLED: 'true'
    networks: [sovereign]
  agent-runtime:
    image: ${AXIOM_AGENT_RUNTIME_IMAGE:?supply approved runtime digest}
    restart: unless-stopped
    environment:
      <<: *common
      AXIOM_OFFLINE_LICENSE: ${AXIOM_OFFLINE_LICENSE:?set signed license}
      MODEL_GATEWAY_URL: http://model-gateway:8001
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?set gateway key}
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:?set runtime token}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?set signing key}
      FEATURE_LIVE_CONNECTORS: 'false'
    depends_on:
      minio-init: {condition: service_completed_successfully}
      supabase-gateway: {condition: service_started}
      temporal: {condition: service_started}
    networks: [sovereign]
  bff:
    image: ${AXIOM_BFF_IMAGE:?supply approved BFF digest}
    restart: unless-stopped
    ports: ['${AXIOM_BIND_ADDRESS:?set intranet bind}:${BFF_PORT:-4000}:4000']
    environment:
      <<: *common
      NODE_ENV: production
      AXIOM_AUTH_MODE: strict
      AXIOM_OFFLINE_LICENSE: ${AXIOM_OFFLINE_LICENSE:?set signed license}
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:?set runtime token}
      MODEL_GATEWAY_URL: http://model-gateway:8001
      MODEL_GATEWAY_API_KEY: ${MODEL_GATEWAY_API_KEY:?set gateway key}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:?set signing key}
      AXIOM_MFA_ENCRYPTION_KEY: ${AXIOM_MFA_ENCRYPTION_KEY:?set MFA key}
      BFF_CORS_ORIGINS: ${BFF_CORS_ORIGINS:?set intranet origin}
      AXIOM_WEB_APP_URL: ${NEXT_PUBLIC_APP_URL:?set web origin}
      FEATURE_LIVE_CONNECTORS: 'false'
      AXIOM_REPORT_EMAIL_MODE: disabled
      AXIOM_CONTACT_EMAIL_MODE: disabled
      AXIOM_INVITATION_EMAIL_MODE: disabled
    depends_on:
      minio-init: {condition: service_completed_successfully}
      agent-runtime: {condition: service_started}
    networks: [sovereign]
  temporal-worker:
    image: ${AXIOM_WORKER_IMAGE:?supply approved worker digest}
    restart: unless-stopped
    environment:
      <<: *common
      AXIOM_OFFLINE_LICENSE: ${AXIOM_OFFLINE_LICENSE:?set signed license}
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      AGENT_RUNTIME_INTERNAL_TOKEN: ${AGENT_RUNTIME_INTERNAL_TOKEN:?set runtime token}
    depends_on:
      temporal: {condition: service_started}
      agent-runtime: {condition: service_started}
    networks: [sovereign]
  web:
    image: ${AXIOM_WEB_IMAGE:?supply approved web digest}
    restart: unless-stopped
    ports: ['${AXIOM_BIND_ADDRESS:?set intranet bind}:${WEB_PORT:-3001}:3001']
    environment:
      NODE_ENV: production
      ENVIRONMENT: onprem
      BFF_PUBLIC_URL: http://bff:4000
      NEXT_PUBLIC_BFF_URL: ${NEXT_PUBLIC_BFF_URL:?set BFF origin}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set web origin}
      SUPABASE_URL: http://supabase-gateway:80
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?mint keys}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:?mint keys}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set Auth origin}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?mint keys}
      AXIOM_E2E_BYPASS_AUTH: 'false'
    depends_on:
      bff: {condition: service_started}
    networks: [sovereign]
networks:
  sovereign:
    internal: true
volumes:
  supabase-db-data:
  temporal-db-data:
  redis-data:
  minio-data:
