# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow file requires a free account on Semgrep.dev to
# manage rules, file ignores, notifications, and more.
#
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: ['main', 'staging']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ['main', 'staging']
  schedule:
    - cron: '24 15 * * 0'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned Semgrep CLI
        run: python -m pip install semgrep==1.180.0

      # semgrep ci uses the existing AppSec Platform rule and blocking policy.
      # No Docker action pre-pull; refuse missing credentials or scanner errors.
      - name: Scan with Semgrep AppSec Platform rules
        run: |
          test -n "$SEMGREP_APP_TOKEN" || { echo "::error::SEMGREP_APP_TOKEN is required for the configured platform rules"; exit 1; }
          semgrep ci --sarif-output=semgrep.sarif --no-suppress-errors
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # Archive SARIF artifact
      - name: Archive Semgrep SARIF report
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
        if: always()

      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
        if: always()
