# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Every run checks the pinned community security policy without credentials.
# A configured SEMGREP_APP_TOKEN adds the managed Semgrep.dev policy scan.
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: ['main', 'staging']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ['main', 'staging']
  schedule:
    - cron: '24 15 * * 0'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned Semgrep CLI
        run: python -m pip install semgrep==1.180.0

      # Every run scans the reviewed, hash-verified community policy. The platform
      # policy is additional when configured; its absence does not skip scanning.
      - name: Download and verify pinned internal CI policy
        run: python .github/ci/run_semgrep.py --prepare-policy
      - name: Test pinned community security policy and failure boundaries
        run: python -m unittest discover -s .github/ci -p 'test_semgrep.py'
      - name: Mandatory community security and secrets baseline
        run: python .github/ci/run_semgrep.py
      - name: Additional managed Semgrep policy when configured
        run: python .github/ci/run_semgrep.py --managed-if-configured
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Archive Semgrep SARIF reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-sarif
          path: |
            semgrep-community.sarif
            semgrep-managed.sarif
          retention-days: 14
          if-no-files-found: error

      - name: Upload community SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep-community.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep-community.sarif
          category: semgrep-community

      - name: Upload managed SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep-managed.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep-managed.sarif
          category: semgrep-managed
