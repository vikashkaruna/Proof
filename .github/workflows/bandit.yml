# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Bandit is a security linter designed to find common security issues in Python code.
# This action will run Bandit on your codebase.
# The results of the scan will be found under the Security tab of your repository.

# https://github.com/marketplace/actions/bandit-scan is ISC licensed, by abirismyname
# https://pypi.org/project/bandit/ is Apache v2.0 licensed, by PyCQA

name: Bandit
on:
  push:
    branches: ['main']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ['main']
  schedule:
    - cron: '27 21 * * 0'

jobs:
  bandit:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install Bandit and SARIF formatter
        run: |
          uv pip install --system bandit bandit-sarif-formatter
      - name: Generate Bandit SARIF report
        run: |
          bandit -r . --ini .bandit -x '*/tests/*,*/.venv/*,*/node_modules/*' \
            -f sarif -o bandit.sarif || true
      - name: Archive Bandit SARIF report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-sarif
          path: bandit.sarif
          retention-days: 14
      - name: Upload Bandit SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always()
        with:
          sarif_file: bandit.sarif
      - name: Enforce Bandit severity thresholds (services medium+, repository high)
        run: |
          echo "bandit: checking services (medium+)"
          bandit -r services/agent-runtime/src services/model-gateway/src services/temporal-workers/src \
            --ini .bandit -x '*/tests/*,*/.venv/*,*/node_modules/*' -ll -ii
          echo "bandit: checking full repository (high)"
          bandit -r . --ini .bandit -x '*/tests/*,*/.venv/*,*/node_modules/*' -lll -ii
