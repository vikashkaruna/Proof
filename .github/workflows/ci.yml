name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: Fresh migrations and direct-client RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-database.sh

  # ─── W0.0 security gate ──────────────────────────────────────────
  # Runs first and gates everything else. The findings it guards against
  # (SEC-1, SEC-2, SEC-3, SEC-13) were all instances of one mistake:
  # environment identity used as a proxy for security posture. This job
  # exists so that mistake cannot be made again silently.
  env-security-gate:
    name: Environment/security separation (W0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-env-security-gate.sh

  # ─── W7.3 control-count consistency (QUA-3) ──────────────────────
  # The library's total is derived from the controls array. Six other
  # places carried their own literal and had drifted to 43 and 48, so a
  # client could see three different totals for the same library.
  control-count-gate:
    name: Control count consistency (W7.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-control-count.sh

  # ─── Static analysis ─────────────────────────────────────────────
  lint-and-typecheck:
    needs: [env-security-gate, control-count-gate, database-security]
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # ─── Unit + integration tests ───────────────────────────────────
  test-ts:
    name: TS unit tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-python-runtime:
    name: Python (agent runtime) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/agent-runtime
      - run: uv run pytest --cov --cov-report=xml
        working-directory: services/agent-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-agent-runtime
          path: services/agent-runtime/coverage.xml

  test-python-temporal:
    name: Python (temporal workers) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/temporal-workers
      - run: uv run pytest
        working-directory: services/temporal-workers

  test-python-gateway:
    name: Python (model gateway) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/model-gateway
      - run: uv run pytest --cov --cov-report=xml
        working-directory: services/model-gateway

  # ─── Security scanning ──────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r services/agent-runtime/pyproject.toml || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build images ──────────────────────────────────────────────
  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [test-ts, test-python-runtime, test-python-temporal, test-python-gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE_TAG=${{ github.sha }}
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for component in web marketing bff agent-runtime model-gateway temporal-worker; do
            docker build -f infra/docker/Dockerfile.${component} \
              -t ghcr.io/${OWNER_LC}/axiom-${component}:${IMAGE_TAG} \
              .
            docker push ghcr.io/${OWNER_LC}/axiom-${component}:${IMAGE_TAG}
          done
