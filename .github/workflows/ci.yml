name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Manual trigger: lets an operator report the required checks for a
  # branch head when the pull_request event is dropped or stuck.
  workflow_dispatch:

# Least privilege by default; jobs that publish images or report status
# declare their own, broader permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployed-http-acceptance:
    name: Container API/browser acceptance (W0)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # No daemon registry mirror in the Supabase CLI jobs: since it was added
      # (a3d58338) `supabase start` failed on every run, rolling back postgres
      # ~1s after create; without it the same start passed (b37091fe).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -f /etc/apt/sources.list.d/*.list || true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx --test scripts/lib/*.test.ts
      - run: pnpm exec tsc -p scripts/tsconfig.acceptance.json
      - run: pnpm --filter @axiom/e2e exec playwright install --with-deps chromium
      - run: ./scripts/test-deployed-http.sh --browser
        # setup-cli exports a single GHCR override, disabling the pinned CLI's
        # ECR/GHCR/source-registry fallback. Clear it only for this test stack;
        # keep the pinned image tags and every health/acceptance check intact.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ''
          AXIOM_PARITY_STARTUP_DEBUG: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-http-acceptance
          path: |
            .axiom-runtime/acceptance/http-*/api-results.json
            .axiom-runtime/acceptance/http-*/browser-results.json
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
      - name: Stop isolated Auth stack
        if: always()
        run: |
          if [ -d .axiom-runtime/parity ]; then
            supabase stop --workdir .axiom-runtime/parity --no-backup
          fi

  python-image-lock-parity:
    env:
      AXIOM_CI_DOCKER_MIRROR: '1'
    name: Python image frozen-lock parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --project services/temporal-workers --locked --no-dev --no-editable
      - name: Causal lock comparison regressions
        run: uv run --project services/temporal-workers --locked --no-dev python -m unittest tests/scripts/test_python_image_lock_parity.py tests/scripts/python_image_lock_parity_integration.py -v
      - name: Build and verify actual Python image dependencies
        run: uv run --project services/temporal-workers --locked --no-dev python scripts/test-python-image-lock-parity.py

  evidence-storage:
    env:
      AXIOM_CI_DOCKER_MIRROR: '1'
    name: Exact-version evidence storage and human ingestion (W8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -f /etc/apt/sources.list.d/*.list || true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      # Archived upstream is pinned, synthetic and isolated; this is provider
      # protocol acceptance, not a maintained production distribution.
      - run: python3 scripts/test-evidence-storage.py --keep-running
      # The parity stack publishes fixed host ports 56320-56329, inside Linux's
      # ephemeral range (32768-60999); an outbound socket holding one made the
      # mail container fail to bind (W1 flake on PR #193). Reserve the range.
      - name: Reserve parity stack host ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=56320-56329
      - run: ./scripts/start-parity-supabase.sh
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ''
          AXIOM_PARITY_STARTUP_DEBUG: '1'
      - run: pnpm exec tsx scripts/seed-personas.ts
      - run: pnpm --filter @axiom/e2e exec playwright install --with-deps chromium
      - name: First PDF in fresh app and BFF processes without renderer warm-up
        run: python3 scripts/test-evidence-storage.py --cold-pdf
      - run: python3 scripts/test-evidence-storage.py --browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-storage-acceptance
          path: |
            .axiom-runtime/evidence-storage/report.json
            .axiom-runtime/evidence-storage/browser-results.json
            .axiom-runtime/evidence-storage/cold-pdf-results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop isolated evidence fixture
        if: always()
        run: python3 scripts/test-evidence-storage.py --stop
      - name: Stop isolated Auth stack
        if: always()
        run: |
          if [ -d .axiom-runtime/parity ]; then
            supabase stop --workdir .axiom-runtime/parity --no-backup
          fi

  workload-identity:
    env:
      AXIOM_CI_DOCKER_MIRROR: '1'
    name: Isolated SPIRE workload identity (W4.3)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/test-workload-identity.py
      - run: python3 scripts/test-spire-deployment.py
      - uses: actions/upload-artifact@v7
        with:
          name: spire-deployment-acceptance
          path: .axiom-runtime/spire-deployment/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: workload-identity-acceptance
          path: .axiom-runtime/workload-identity/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  workload-host:
    env:
      AXIOM_CI_DOCKER_MIRROR: '1'
    name: Protected SPIRE host and native restart (W4.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - run: /usr/bin/python3 scripts/test-workload-host.py
      - name: Disposable native systemd and loop-device fixture
        run: sudo -E /usr/bin/python3 scripts/test-workload-host-systemd.py --isolated-ci
      - uses: actions/upload-artifact@v7
        with:
          name: workload-host-acceptance
          path: |
            .axiom-runtime/workload-host/results.json
            .axiom-runtime/workload-host-systemd/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  workload-runner-host:
    env:
      AXIOM_CI_DOCKER_MIRROR: '1'
    name: Native SPIRE runner and observer lifecycle (W4.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - run: /usr/bin/python3 scripts/test-workload-host.py
      - name: Disposable runner systemd and loop-device fixture
        run: sudo -E /usr/bin/python3 scripts/test-workload-runner-systemd.py --isolated-ci
      - uses: actions/upload-artifact@v7
        with:
          name: workload-runner-host-acceptance
          path: .axiom-runtime/workload-runner-systemd/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  database-security:
    env:
      AXIOM_TEST_POSTGRES_IMAGE: mirror.gcr.io/supabase/postgres:17.6.1.127@sha256:be60aee15997daca475b710b734bc6bfe52cd544dcd7e9fd2ff58210b6747d83
    name: Fresh migrations and direct-client RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - run: |
          python3 -m unittest discover -s .github/ci -p 'test_configure_docker_mirror.py'
          python3 -m unittest discover -s .github/ci -p 'test_fixture_images.py'
          python3 -m unittest discover -s .github/ci -p 'test_supabase_startup.py'
      - run: ./scripts/test-database.sh
      - run: bash tests/scripts/test-backup-restore.sh
      - run: bash tests/scripts/test-dev-docker-lifecycle.sh
      - run: python3 scripts/check-compose-writer-scoping.py
      - run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'

  prativedan-assessment-interoperability:
    name: Dedicated assessment SQL and renderer interoperability (W2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AXIOM_TEST_POSTGRES_IMAGE: mirror.gcr.io/supabase/postgres:17.6.1.127@sha256:be60aee15997daca475b710b734bc6bfe52cd544dcd7e9fd2ff58210b6747d83
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --extra dev --project services/agent-runtime
      - run: uv run --locked --extra dev --project services/agent-runtime pytest services/agent-runtime/tests/test_prativedan_assessment_interop.py
      - run: bash scripts/test-prativedan-assessment-interoperability.sh
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-prativedan-assessment-v2-contract
          path: .axiom-runtime/contracts/prativedan-assessment-v2
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  prativedan-assessment-controller-interoperability:
    name: Actual assessment receipts and settlement interoperability (W2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AXIOM_TEST_POSTGRES_IMAGE: mirror.gcr.io/supabase/postgres:17.6.1.127@sha256:be60aee15997daca475b710b734bc6bfe52cd544dcd7e9fd2ff58210b6747d83
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --extra dev --project services/agent-runtime
      - run: uv run --locked --extra dev --project services/agent-runtime pytest services/agent-runtime/tests/test_prativedan_assessment_dispatch.py services/agent-runtime/tests/test_ledger_started_output.py services/agent-runtime/tests/test_prativedan_assessment_runtime_interop.py
      - run: bash scripts/test-prativedan-assessment-controller-interoperability.sh
      - uses: actions/upload-artifact@v7
        with:
          name: disposable-prativedan-assessment-controller-contract
          path: .axiom-runtime/contracts/prativedan-assessment-controller
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  strict-auth-parity:
    env:
      AXIOM_CI_DOCKER_MIRROR: '1'
    name: Real Auth/PostgREST strict topology parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -f /etc/apt/sources.list.d/*.list || true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      # start-parity-supabase.sh publishes 56320-56329; see the W1 note.
      - name: Reserve parity stack host ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=56320-56329
      - run: ./scripts/test-strict-parity.sh
        # setup-cli exports a single GHCR override, disabling the pinned CLI's
        # ECR/GHCR/source-registry fallback. Clear it only for this test stack;
        # keep the pinned image tags and every health/acceptance check intact.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ''
          AXIOM_PARITY_STARTUP_DEBUG: '1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked
        working-directory: services/agent-runtime
      - run: uv run --locked python ../../scripts/verify-runtime-audit.py
        working-directory: services/agent-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-audit-acceptance
          path: .axiom-runtime/runtime-audit/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - run: uv sync --locked
        working-directory: services/temporal-workers
      - run: python3 scripts/test-workload-identity.py --assessment
      - uses: actions/upload-artifact@v7
        with:
          name: workload-assessment-acceptance
          path: .axiom-runtime/workload-assessment/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: workload-trust-acceptance
          path: .axiom-runtime/workload-trust/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Stop the isolated parity project
        if: always()
        run: |
          if [ -d .axiom-runtime/parity ]; then
            supabase stop --workdir .axiom-runtime/parity --no-backup
          fi

  # ─── W1 browser persona journeys ─────────────────────────────────
  # Real GoTrue accounts, one per persona, signing in through the real login
  # form against AXIOM_AUTH_MODE=strict.
  #
  # This job is new because the suite it runs was never runnable: `tests/e2e`
  # was missing from pnpm-workspace.yaml, so `@playwright/test` was never
  # installed and `pnpm test:e2e` resolved to no package and exited 0 having
  # run nothing. The harness it did carry configured `AXIOM_E2E_BYPASS_AUTH`
  # and the `axiom_e2e_bypass` cookie, both deleted from the app in W0.0 —
  # and under that bypass every caller resolves to one founder identity, so a
  # persona journey could not have failed for the right reason.
  persona-journeys:
    name: Browser persona journeys (W1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo rm -f /etc/apt/sources.list.d/*.list || true
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      # The parity stack publishes fixed host ports 56320-56329, inside Linux's
      # ephemeral range (32768-60999); an outbound socket holding one made the
      # mail container fail to bind (W1 flake on PR #193). Reserve the range.
      - name: Reserve parity stack host ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=56320-56329
      - run: ./scripts/start-parity-supabase.sh
        # setup-cli exports a single GHCR override, disabling the pinned CLI's
        # ECR/GHCR/source-registry fallback. Clear it only for this test stack;
        # keep the pinned image tags and every health/acceptance check intact.
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ''
          AXIOM_PARITY_STARTUP_DEBUG: '1'
      - run: pnpm exec tsx scripts/seed-personas.ts
      - run: pnpm --filter @axiom/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @axiom/e2e exec playwright test
      - name: Persona journey report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: persona-journeys-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - name: Stop the isolated parity project
        if: always()
        run: |
          if [ -d .axiom-runtime/parity ]; then
            supabase stop --workdir .axiom-runtime/parity --no-backup
          fi

  # ─── W0.0 security gate ──────────────────────────────────────────
  # Runs first and gates everything else. The findings it guards against
  # (SEC-1, SEC-2, SEC-3, SEC-13) were all instances of one mistake:
  # environment identity used as a proxy for security posture. This job
  # exists so that mistake cannot be made again silently.
  env-security-gate:
    name: Environment/security separation (W0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-env-security-gate.sh

  # ─── W0.1 deployment configuration coverage ──────────────────────
  # Terraform variables were mapped to .env keys by hand, one `if` per
  # line, in a deploy script. It covered 15 of preprod's 23, so the rest
  # silently took Terraform defaults — including the MFA encryption key,
  # which meant an operator's configured key was ignored while Terraform
  # minted a different one, and the evidence retention period, which could
  # put a test-length COMPLIANCE lock on a bucket documented as seven
  # years. Nothing failed; the values were simply not the ones configured.
  tfvars-coverage-gate:
    name: Deployment configuration coverage (W0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-tfvars-coverage.sh
      - run: python3 scripts/check-cloudrun-auth-wiring.py
      - run: python3 scripts/check-cloudrun-iam.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python3 -m pip install pytest==8.4.2 PyYAML==6.0.3
      - run: python3 -m unittest discover -s tests/deployment -p 'test_*.py'
      - name: Marketing profile and environment authority regressions
        run: python3 -m pytest -q tests/deployment services/marketing-lifecycle/tests

      # Every surface that runs the BFF must be able to carry BOTH halves of
      # the MFA key ring. Rotation landed with the retiring list wired into
      # the Compose files only, so Cloud Run and Helm could start the BFF with
      # no path for it — a deploy that succeeds and then fails one user at a
      # time as their old-key factors come up for verification.
      - run: ./scripts/check-mfa-ring-coverage.sh

      # Terraform formatting had drifted on four files across both
      # environments and nothing noticed, because no job had ever run
      # `terraform fmt`. One of the four drifted without anyone writing a
      # misaligned line: fmt aligns contiguous runs of assignments, so the
      # comment 66885c5 added inside preprod's `locals` block split it into
      # two alignment groups and stale-padded the six keys above it. That is
      # exactly the shape a reviewer skims past, which is the argument for
      # deciding it mechanically rather than by eye.
      #
      # Pinned rather than floating: fmt's own rules can change between
      # Terraform releases, and an unpinned gate would turn an upstream
      # release into a red build on untouched files.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform

      # fmt only parses; it never resolves a module or a reference, so it
      # cannot see a module block whose arguments the pinned version rejects.
      # `validate` does, which is how envs/prod was found unloadable: three
      # variables declared twice, seven arguments spelled for module majors it
      # does not pin, a helm_release using the provider v3 `set` form under a
      # v2 pin, and a lifecycle rule with no filter. prod had never been
      # initialised at all, so none of it had ever been reported.
      #
      # The loop discovers environments instead of naming them, so a third one
      # cannot be added ungated — the failure mode that produced prod.
      # -backend=false because prod's main.tf carries a live `backend "s3"`
      # block; this gate reads configuration and must not touch state.
      #
      # Error level only. `validate` exits 0 on warnings, so the lifecycle
      # rule's empty `filter {}` is defensive rather than held here — removing
      # it warns and still passes. Promoting warnings to failures was declined
      # on purpose: a provider minor can introduce one on untouched files,
      # which is the brittleness the pinned terraform_version above avoids.
      - name: terraform validate (all environments)
        run: |
          set -euo pipefail
          for env in infra/terraform/envs/*/; do
            echo "::group::${env}"
            terraform -chdir="${env}" init -backend=false -input=false
            terraform -chdir="${env}" validate
            echo "::endgroup::"
          done

      - name: Offline Terraform runtime IAM and MFA rotation tests
        run: terraform -chdir=infra/terraform/envs/preprod test -no-color

      - name: Offline marketing acceptance profile tests
        run: terraform -chdir=infra/terraform/envs/marketing-preprod test -no-color

      - name: Offline private issuer and runner boundary tests
        run: |
          python3 scripts/check-workload-iam.py
          terraform -chdir=infra/terraform/modules/workload-vms init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/workload-vms validate
          terraform -chdir=infra/terraform/modules/workload-vms test -no-color
          terraform -chdir=infra/terraform/modules/edge-waf init -backend=false -input=false
          terraform -chdir=infra/terraform/modules/edge-waf validate
          terraform -chdir=infra/terraform/modules/edge-waf test -no-color

  # ─── W0.1 deployment manifests render ────────────────────────────
  # The Helm chart had never been rendered anywhere. No job invoked helm and
  # helm is not installed on the dev machines, so `check-mfa-ring-coverage.sh`
  # above could confirm the retiring-key variable was PRESENT in the chart
  # while the chart it was present in could not produce a manifest at all.
  # It had four defects: `range` over a boolean in ingress.yaml, two values
  # keys the templates dereference that values.yaml never defined, and an
  # annotations block emitted outside metadata. Every one is caught in about
  # a second by actually rendering.
  helm-render:
    name: Deployment manifests render (W0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # Pinned rather than floating: a validator that silently changes its
      # schema set turns this gate into a source of unrelated red builds.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: helm lint
        run: helm lint infra/helm/axiom-proof

      # Own interpreter rather than the runner's system Python: a system-wide
      # `pip install` trips PEP 668 (externally-managed-environment) on the
      # newer Ubuntu images.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install PyYAML for the rendered-manifest checks
        run: pip install --quiet pyyaml

      # Rendering the defaults alone is not coverage: a `{{- with }}` guarding
      # an empty map never executes, which is exactly how the ServiceAccount
      # annotations defect survived — clean on defaults, invalid YAML the
      # moment an operator attaches an IRSA role. Each fixture in ci/ forces
      # one such branch; values-prod.yaml.example is rendered because it is
      # the shape that actually ships. -strict rejects unknown and duplicate
      # fields, so a typo'd key fails here instead of being silently dropped
      # by the API server on apply.
      - name: helm template + schema validation
        run: |
          set -euo pipefail
          CHART=infra/helm/axiom-proof
          VALUE_SETS=("" "-f ${CHART}/values-prod.yaml.example")
          for fixture in "${CHART}"/ci/*-values.yaml; do
            VALUE_SETS+=("-f ${fixture}")
          done

          # -cache matters: without it kubeconform refetches every schema for
          # each value set, turning a one-second gate into minutes of network.
          mkdir -p /tmp/kubeconform-cache

          for value_set in "${VALUE_SETS[@]}"; do
            echo "::group::helm template ${value_set:-(chart defaults)}"
            # Rendered to a file rather than piped because two checks consume
            # it, and they answer different questions: kubeconform asks whether
            # each manifest is well-formed, check-rendered-manifests.py asks
            # whether the set of them means what the chart claims.
            # Unquoted on purpose: each entry is a flag pair, not one argument.
            helm template axiom-proof "${CHART}" ${value_set} > /tmp/rendered.yaml
            kubeconform -strict -summary \
              -cache /tmp/kubeconform-cache \
              -kubernetes-version 1.30.0 /tmp/rendered.yaml
            python3 scripts/check-rendered-manifests.py \
              --expect-components web,marketing,bff,agent-runtime,model-gateway,temporal-worker \
              < /tmp/rendered.yaml
            python3 infra/helm/axiom-proof/ci/assert-secret-scoping.py < /tmp/rendered.yaml
            echo "::endgroup::"
          done

  # ─── W0.1 self-hosted Supabase topology ──────────────────────────
  # Higher environments self-host GoTrue and PostgREST against their own
  # Postgres rather than using Supabase Cloud, so preprod is a real
  # replica and no third-party processor sits in the data path. That
  # shape had never been run: GoTrue's MFA migration creates its enums
  # unqualified, so without search_path=auth they land in `public` and a
  # later migration dies having already created sixteen tables; and with
  # no default group GoTrue emits an empty `role` claim, which PostgREST
  # turns into `set local role ""`. Both failures look like something
  # else entirely, so they are pinned here.
  selfhosted-supabase:
    name: Self-hosted Supabase topology (W0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The BFF-shaped supabase-js probe resolves the client from services/bff.
      - run: pnpm install --frozen-lockfile --filter @axiom/bff...
      - run: ./tests/deployment/selfhosted-supabase.sh
        env:
          AXIOM_TEST_POSTGRES_IMAGE: mirror.gcr.io/supabase/postgres:17.6.1.127@sha256:be60aee15997daca475b710b734bc6bfe52cd544dcd7e9fd2ff58210b6747d83
          AXIOM_TEST_GOTRUE_IMAGE: mirror.gcr.io/supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
          AXIOM_TEST_POSTGREST_IMAGE: mirror.gcr.io/postgrest/postgrest:v16.4@sha256:d155c6718ed9a9f990d159a2ab7c0a3f16944dbb6d0a0344557421042acfe0df
          AXIOM_TEST_INGRESS_IMAGE: mirror.gcr.io/library/nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2

  # ─── W7.3 control-count consistency (QUA-3) ──────────────────────
  # The library's total is derived from the controls array. Six other
  # places carried their own literal and had drifted to 43 and 48, so a
  # client could see three different totals for the same library.
  control-count-gate:
    name: Control count consistency (W7.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-control-count.sh

  # R-06: the agent runtime scores assessments against a GENERATED copy of the
  # control library. W7.1's citation correction landed in TypeScript and never
  # reached that copy, so for a year the runtime cited rules the Gazette puts
  # elsewhere. The count gate could not see it — both sides had 46 controls the
  # whole time; only the citations differed. This one compares the bytes.
  control-library-drift-gate:
    name: Control library TS → runtime parity (W7 · R-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-controls-drift.sh

  # ─── Static analysis ─────────────────────────────────────────────
  lint-and-typecheck:
    needs:
      [
        env-security-gate,
        control-count-gate,
        control-library-drift-gate,
        database-security,
        prativedan-assessment-interoperability,
        prativedan-assessment-controller-interoperability,
        strict-auth-parity,
        deployed-http-acceptance,
        workload-host,
      ]
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # ─── Unit + integration tests ───────────────────────────────────
  test-ts:
    name: TS unit tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # report-kit cross-language and adversarial verifier tests run inside pnpm test.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  coverage-ts:
    name: TypeScript source coverage (80% per module)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-coverage-floors.sh --typescript

  # ─── W4.6 first real SQL binding ────────────────────────────────
  # Runs the read-only Postgres adapter against a disposable live server with
  # least-privilege, writer and superuser roles. The suite refuses to skip here.
  sql-binding:
    name: Live SQL binding (W4.6)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: w46-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axiom/bff exec vitest run src/connectors/sql
        env:
          AXIOM_SQL_LIVE_URL: postgres://postgres:w46-ci-only@127.0.0.1:5432/postgres
          AXIOM_SQL_LIVE_REQUIRED: '1'

  w9-performance-probe:
    name: W9 real component performance probe (NFRs unverified)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_PASSWORD: w9-ci-only
          POSTGRES_DB: axiom_w9_probe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d axiom_w9_probe" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test services/bff/scripts/w9-live-performance.test.mjs
      - run: pnpm --filter @axiom/e2e exec playwright install --with-deps chromium
      - run: |
          executable=$(pnpm --filter @axiom/e2e exec node -p "require('@playwright/test').chromium.executablePath()")
          echo "CHROME_PATH=$executable" >> "$GITHUB_ENV"
      - run: pnpm --filter @axiom/bff exec tsx scripts/w9-live-performance.ts > w9-performance.json
        env:
          AXIOM_W9_DISPOSABLE: '1'
          AXIOM_W9_DISPOSABLE_URL: postgres://postgres:w9-ci-only@127.0.0.1:5432/axiom_w9_probe
      - run: |
          node -e "const r=require('./w9-performance.json'); if(r.fixtureRows!==1000000 || r.discovery.sampledDistinctRows!==200 || r.report.renderer!=='chromium' || r.nfr7!=='UNVERIFIED' || r.nfr8!=='UNVERIFIED') process.exit(1)"
      - uses: actions/upload-artifact@v7
        with:
          name: w9-real-component-performance
          path: w9-performance.json
          if-no-files-found: error

  # ─── W4.6 MySQL read binding ────────────────────────────────────
  # Runs the read-only MySQL adapter against a disposable live MySQL 8 server
  # with least-privilege, writer and superuser accounts. Same class of
  # assertions as the Postgres job; the suite refuses to skip here.
  mysql-binding:
    name: Live SQL binding (W4.6 MySQL)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      mysql:
        image: mirror.gcr.io/library/mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: w46-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pw46-ci-only" --health-interval 2s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axiom/bff exec vitest run src/connectors/sql/mysql-read.live.test.ts
        env:
          AXIOM_MYSQL_LIVE_URL: mysql://root:w46-ci-only@127.0.0.1:3306/mysql
          AXIOM_MYSQL_LIVE_REQUIRED: '1'

  test-python-runtime:
    name: Python (agent runtime) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/agent-runtime
      - name: Strict runtime source types
        run: uv run mypy src/axiom ../../packages/model-accounting-python/axiom_model_accounting.py
        working-directory: services/agent-runtime
      - name: Runtime source lint
        run: uv run ruff check src/axiom ../../packages/model-accounting-python
        working-directory: services/agent-runtime
      - run: uv run pytest --cov --cov-report=xml --cov-fail-under=80
        working-directory: services/agent-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-agent-runtime
          path: services/agent-runtime/coverage.xml

  test-python-temporal:
    name: Python (temporal workers) tests
    runs-on: ubuntu-latest
    # Fail closed on stalled test-server startup or tests; never run indefinitely.
    timeout-minutes: 20
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/temporal-workers
      - run: timeout --signal=TERM --kill-after=10s 15m uv run pytest --cov --cov-report=xml --cov-fail-under=80
        working-directory: services/temporal-workers
        env:
          PYTHONUNBUFFERED: '1'
          AXIOM_TEMPORAL_ACCEPTANCE_REPORT: ../../.axiom-runtime/temporal/results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: temporal-orchestration-acceptance
          path: .axiom-runtime/temporal/results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  test-python-gateway:
    name: Python (model gateway) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/model-gateway
      - run: uv run ruff check src/model_gateway tests
        working-directory: services/model-gateway
      - run: uv run mypy src/model_gateway --strict
        working-directory: services/model-gateway
        env:
          MYPYPATH: ../../packages/offline-license-python
      - run: uv run pytest --cov --cov-report=xml --cov-fail-under=80
        working-directory: services/model-gateway

  # ─── Security scanning ──────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: pnpm audit (expiring allowlist in security/audit-allowlist.json)
        run: python3 scripts/audit_prod.py
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Audit locked Python runtime dependencies
        run: |
          for service in agent-runtime temporal-workers model-gateway; do
            uv export --locked --no-dev --no-emit-project --project "services/$service" --output-file "$RUNNER_TEMP/$service-requirements.txt"
            uvx --python 3.14 pip-audit==2.10.1 --strict --disable-pip --no-deps -r "$RUNNER_TEMP/$service-requirements.txt"
          done
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build images ──────────────────────────────────────────────
  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs:
      [
        deployed-http-acceptance,
        python-image-lock-parity,
        evidence-storage,
        workload-identity,
        workload-host,
        workload-runner-host,
        database-security,
        prativedan-assessment-interoperability,
        prativedan-assessment-controller-interoperability,
        strict-auth-parity,
        persona-journeys,
        env-security-gate,
        tfvars-coverage-gate,
        helm-render,
        selfhosted-supabase,
        control-count-gate,
        control-library-drift-gate,
        lint-and-typecheck,
        test-ts,
        coverage-ts,
        sql-binding,
        w9-performance-probe,
        mysql-binding,
        test-python-runtime,
        test-python-temporal,
        test-python-gateway,
        security,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Configure Docker Hub cache on disposable CI runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 .github/ci/configure_docker_mirror.py
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE_TAG=${{ github.sha }}
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for component in web marketing bff agent-runtime model-gateway temporal-worker; do
            docker buildx build --load -f infra/docker/Dockerfile.${component} \
              -t ghcr.io/${OWNER_LC}/axiom-${component}:${IMAGE_TAG} \
              .
            docker push ghcr.io/${OWNER_LC}/axiom-${component}:${IMAGE_TAG}
          done
