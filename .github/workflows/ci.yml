name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: Fresh migrations and direct-client RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/test-database.sh

  strict-auth-parity:
    name: Real Auth/PostgREST strict topology parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/test-strict-parity.sh
      - name: Stop the isolated parity project
        if: always()
        run: supabase stop --workdir .axiom-runtime/parity --no-backup

  # ─── W1 browser persona journeys ─────────────────────────────────
  # Real GoTrue accounts, one per persona, signing in through the real login
  # form against AXIOM_AUTH_MODE=strict.
  #
  # This job is new because the suite it runs was never runnable: `tests/e2e`
  # was missing from pnpm-workspace.yaml, so `@playwright/test` was never
  # installed and `pnpm test:e2e` resolved to no package and exited 0 having
  # run nothing. The harness it did carry configured `AXIOM_E2E_BYPASS_AUTH`
  # and the `axiom_e2e_bypass` cookie, both deleted from the app in W0.0 —
  # and under that bypass every caller resolves to one founder identity, so a
  # persona journey could not have failed for the right reason.
  persona-journeys:
    name: Browser persona journeys (W1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/start-parity-supabase.sh
      - run: pnpm exec tsx scripts/seed-personas.ts
      - run: pnpm --filter @axiom/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @axiom/e2e exec playwright test
      - name: Persona journey report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: persona-journeys-report
          path: tests/e2e/playwright-report
          retention-days: 7
      - name: Stop the isolated parity project
        if: always()
        run: supabase stop --workdir .axiom-runtime/parity --no-backup

  # ─── W0.0 security gate ──────────────────────────────────────────
  # Runs first and gates everything else. The findings it guards against
  # (SEC-1, SEC-2, SEC-3, SEC-13) were all instances of one mistake:
  # environment identity used as a proxy for security posture. This job
  # exists so that mistake cannot be made again silently.
  env-security-gate:
    name: Environment/security separation (W0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-env-security-gate.sh

  # ─── W0.1 deployment configuration coverage ──────────────────────
  # Terraform variables were mapped to .env keys by hand, one `if` per
  # line, in a deploy script. It covered 15 of preprod's 23, so the rest
  # silently took Terraform defaults — including the MFA encryption key,
  # which meant an operator's configured key was ignored while Terraform
  # minted a different one, and the evidence retention period, which could
  # put a test-length COMPLIANCE lock on a bucket documented as seven
  # years. Nothing failed; the values were simply not the ones configured.
  tfvars-coverage-gate:
    name: Deployment configuration coverage (W0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-tfvars-coverage.sh
      # Every surface that runs the BFF must be able to carry BOTH halves of
      # the MFA key ring. Rotation landed with the retiring list wired into
      # the Compose files only, so Cloud Run and Helm could start the BFF with
      # no path for it — a deploy that succeeds and then fails one user at a
      # time as their old-key factors come up for verification.
      - run: ./scripts/check-mfa-ring-coverage.sh

  # ─── W0.1 deployment manifests render ────────────────────────────
  # The Helm chart had never been rendered anywhere. No job invoked helm and
  # helm is not installed on the dev machines, so `check-mfa-ring-coverage.sh`
  # above could confirm the retiring-key variable was PRESENT in the chart
  # while the chart it was present in could not produce a manifest at all.
  # It had four defects: `range` over a boolean in ingress.yaml, two values
  # keys the templates dereference that values.yaml never defined, and an
  # annotations block emitted outside metadata. Every one is caught in about
  # a second by actually rendering.
  helm-render:
    name: Deployment manifests render (W0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Pinned rather than floating: a validator that silently changes its
      # schema set turns this gate into a source of unrelated red builds.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: helm lint
        run: helm lint infra/helm/axiom-proof

      # Own interpreter rather than the runner's system Python: a system-wide
      # `pip install` trips PEP 668 (externally-managed-environment) on the
      # newer Ubuntu images.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PyYAML for the rendered-manifest checks
        run: pip install --quiet pyyaml

      # Rendering the defaults alone is not coverage: a `{{- with }}` guarding
      # an empty map never executes, which is exactly how the ServiceAccount
      # annotations defect survived — clean on defaults, invalid YAML the
      # moment an operator attaches an IRSA role. Each fixture in ci/ forces
      # one such branch; values-prod.yaml.example is rendered because it is
      # the shape that actually ships. -strict rejects unknown and duplicate
      # fields, so a typo'd key fails here instead of being silently dropped
      # by the API server on apply.
      - name: helm template + schema validation
        run: |
          set -euo pipefail
          CHART=infra/helm/axiom-proof
          VALUE_SETS=("" "-f ${CHART}/values-prod.yaml.example")
          for fixture in "${CHART}"/ci/*-values.yaml; do
            VALUE_SETS+=("-f ${fixture}")
          done

          # -cache matters: without it kubeconform refetches every schema for
          # each value set, turning a one-second gate into minutes of network.
          mkdir -p /tmp/kubeconform-cache

          for value_set in "${VALUE_SETS[@]}"; do
            echo "::group::helm template ${value_set:-(chart defaults)}"
            # Rendered to a file rather than piped because two checks consume
            # it, and they answer different questions: kubeconform asks whether
            # each manifest is well-formed, check-rendered-manifests.py asks
            # whether the set of them means what the chart claims.
            # Unquoted on purpose: each entry is a flag pair, not one argument.
            helm template axiom-proof "${CHART}" ${value_set} > /tmp/rendered.yaml
            kubeconform -strict -summary \
              -cache /tmp/kubeconform-cache \
              -kubernetes-version 1.30.0 /tmp/rendered.yaml
            python3 scripts/check-rendered-manifests.py \
              --expect-components web,marketing,bff,agent-runtime,model-gateway,temporal-worker \
              < /tmp/rendered.yaml
            echo "::endgroup::"
          done

  # ─── W0.1 self-hosted Supabase topology ──────────────────────────
  # Higher environments self-host GoTrue and PostgREST against their own
  # Postgres rather than using Supabase Cloud, so preprod is a real
  # replica and no third-party processor sits in the data path. That
  # shape had never been run: GoTrue's MFA migration creates its enums
  # unqualified, so without search_path=auth they land in `public` and a
  # later migration dies having already created sixteen tables; and with
  # no default group GoTrue emits an empty `role` claim, which PostgREST
  # turns into `set local role ""`. Both failures look like something
  # else entirely, so they are pinned here.
  selfhosted-supabase:
    name: Self-hosted Supabase topology (W0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: ./tests/deployment/selfhosted-supabase.sh

  # ─── W7.3 control-count consistency (QUA-3) ──────────────────────
  # The library's total is derived from the controls array. Six other
  # places carried their own literal and had drifted to 43 and 48, so a
  # client could see three different totals for the same library.
  control-count-gate:
    name: Control count consistency (W7.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-control-count.sh

  # R-06: the agent runtime scores assessments against a GENERATED copy of the
  # control library. W7.1's citation correction landed in TypeScript and never
  # reached that copy, so for a year the runtime cited rules the Gazette puts
  # elsewhere. The count gate could not see it — both sides had 46 controls the
  # whole time; only the citations differed. This one compares the bytes.
  control-library-drift-gate:
    name: Control library TS → runtime parity (W7 · R-06)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-controls-drift.sh

  # ─── Static analysis ─────────────────────────────────────────────
  lint-and-typecheck:
    needs:
      [
        env-security-gate,
        control-count-gate,
        control-library-drift-gate,
        database-security,
        strict-auth-parity,
      ]
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  # ─── Unit + integration tests ───────────────────────────────────
  test-ts:
    name: TS unit tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-python-runtime:
    name: Python (agent runtime) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/agent-runtime
      - run: uv run pytest --cov --cov-report=xml
        working-directory: services/agent-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-agent-runtime
          path: services/agent-runtime/coverage.xml

  test-python-temporal:
    name: Python (temporal workers) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/temporal-workers
      - run: uv run pytest
        working-directory: services/temporal-workers

  test-python-gateway:
    name: Python (model gateway) tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --extra dev
        working-directory: services/model-gateway
      - run: uv run pytest --cov --cov-report=xml
        working-directory: services/model-gateway

  # ─── Security scanning ──────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r services/agent-runtime/pyproject.toml || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build images ──────────────────────────────────────────────
  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [test-ts, test-python-runtime, test-python-temporal, test-python-gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE_TAG=${{ github.sha }}
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for component in web marketing bff agent-runtime model-gateway temporal-worker; do
            docker build -f infra/docker/Dockerfile.${component} \
              -t ghcr.io/${OWNER_LC}/axiom-${component}:${IMAGE_TAG} \
              .
            docker push ghcr.io/${OWNER_LC}/axiom-${component}:${IMAGE_TAG}
          done
