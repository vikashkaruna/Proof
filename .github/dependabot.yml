version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    rebase-strategy: 'auto'
    delete-branch-after-merge: true
    commit-message:
      prefix: 'deps'
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
    labels:
      - 'dependencies'
    ignore:
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'pip'
    directory: '/services/agent-runtime'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    rebase-strategy: 'auto'
    delete-branch-after-merge: true
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'

  - package-ecosystem: 'pip'
    directory: '/services/model-gateway'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    rebase-strategy: 'auto'
    delete-branch-after-merge: true
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'

  - package-ecosystem: 'pip'
    directory: '/services/temporal-workers'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    rebase-strategy: 'auto'
    delete-branch-after-merge: true
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    rebase-strategy: 'auto'
    delete-branch-after-merge: true
    commit-message:
      prefix: 'ci'
    labels:
      - 'ci'
