[project]
name = "axiom-proof-agent-runtime"
version = "0.1.0"
description = "Axiom Proof agent runtime — 10 named agents that discover, classify, assess, collect evidence, plan, execute, audit, watch, report, and signal."
authors = [{ name = "Axiom Minds Private Limited" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  "httpx>=0.27.2",
  "supabase>=2.8.0",
  "boto3>=1.35.0",
  "litellm>=1.50.0",
  "temporalio>=1.8.0",
  "pydantic[email]>=2.8.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "presidio-analyzer>=2.2.0",
  "python-ulid>=3.0.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0",
  "markdown>=3.6.0",
  "reportlab>=4.2.0",
  "jinja2>=3.1.4",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "freezegun>=1.5.0",
  "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "PT", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
  "security: security-sensitive tests (approval engine, RBAC, ledger)",
  "integration: cross-service tests",
  "unit: unit tests",
  "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:",
]
