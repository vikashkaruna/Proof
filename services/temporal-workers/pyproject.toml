[project]
name = "axiom-temporal-workers"
version = "0.1.0"
description = "Axiom Proof Temporal workers — durable orchestration of agentic workflows."
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }

dependencies = [
  "temporalio>=1.8.0",
  "httpx>=0.27.2",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  "structlog>=24.4.0",
  "supabase>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temporal_workers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
